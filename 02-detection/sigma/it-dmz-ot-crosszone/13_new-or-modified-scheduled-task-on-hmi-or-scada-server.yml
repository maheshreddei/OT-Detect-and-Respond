title: New or Modified Scheduled Task on HMI or SCADA Server
id: d1a1b2c3-0003-4a1b-8c1d-3a2b3c4d5e02
status: experimental
description: Detects creation or modification of a scheduled task or Windows service on an L2 HMI or L3 SCADA server, a common post-compromise persistence technique observed in CRASHOVERRIDE/Industroyer-class OT intrusions.
references:
  - https://attack.mitre.org/techniques/T1053/005/
  - https://attack.mitre.org/techniques/T0839/
tags:
  - attack.t1053.005
  - attack.ics.t0839
author: Mahesh
date: 2026/07/01
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/create'
    ComputerName|in_list: 'l2_l3_ot_servers'
  condition: selection
falsepositives:
  - Authorized engineering team scheduling a routine maintenance task
level: high
