title: Safety Instrumented System Point Forced or Overridden
id: d1a1b2c3-0005-4a1b-8c1d-5a2b3c4d5e01
status: experimental
description: Detects a force/override flag being set on a tag belonging to the Safety Instrumented System (SIS) address range, a technique directly associated with the TRITON/TRISIS attack against a Schneider Electric Triconex SIS controller.
references:
  - https://attack.mitre.org/techniques/T0837/
  - https://www.cisa.gov/news-events/ics-advisories
tags:
  - attack.ics.t0837
  - attack.ics.t0800
author: Mahesh
date: 2026/07/01
logsource:
  category: ics-network
  product: generic
detection:
  selection:
    node_id|startswith: 'SIS.'
    write_value_flag: 'force_override'
  condition: selection
falsepositives:
  - Authorized SIS bypass during a documented maintenance override procedure with management of change sign-off
level: critical
