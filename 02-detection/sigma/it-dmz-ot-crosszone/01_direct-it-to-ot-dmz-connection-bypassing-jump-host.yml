title: Direct IT-to-OT-DMZ Connection Bypassing Jump Host
id: d1a1b2c3-0001-4a1b-8c1d-1a2b3c4d5e01
status: experimental
description: Detects a network flow originating from an enterprise IT subnet landing directly on an OT DMZ host without traversing the designated jump server / reverse proxy, indicating a possible firewall misconfiguration or an attacker pivoting around the documented access path.
references:
  - https://attack.mitre.org/techniques/T0886/
tags:
  - attack.ics.t0886
  - attack.t1021
author: Mahesh
date: 2026/07/01
logsource:
  category: firewall
  product: generic
detection:
  selection:
    src_zone: IT
    dst_zone: OT_DMZ
  filter:
    dst_ip|in_list: 'approved_jump_host_ips'
  condition: selection and not filter
falsepositives:
  - Newly deployed DMZ service not yet added to the jump-host allow-list
level: high
