title: Vendor Remote Access Session Duration or Scope Anomaly
id: d1a1b2c3-0002-4a1b-8c1d-2a2b3c4d5e05
status: experimental
description: Detects a third-party/vendor remote access session exceeding the typical support-call duration baseline, or touching systems outside the vendor's contracted scope, indicating possible session hijacking or scope creep beyond the support agreement.
references:
  - https://attack.mitre.org/techniques/T1133/
tags:
  - attack.t1133
  - attack.ics.t0883
author: Mahesh
date: 2026/07/01
logsource:
  category: authentication
  product: vpn
detection:
  selection:
    account_type: vendor
  timeframe: 1
  condition: selection | duration > 4h
falsepositives:
  - Legitimate extended support engagement for a major upgrade or incident response
level: medium
