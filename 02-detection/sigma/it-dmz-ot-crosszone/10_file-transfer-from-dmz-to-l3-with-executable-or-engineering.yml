title: File Transfer From DMZ to L3 With Executable or Engineering Project Extension
id: d1a1b2c3-0002-4a1b-8c1d-2a2b3c4d5e04
status: experimental
description: Detects an SMB, FTP, or SCP file transfer from an OT DMZ host into an L3 historian or SCADA server where the file extension is an executable, script, or PLC engineering project type (.exe, .dll, .ps1, .acd, .s7p, .ap16, .l5x), occurring outside an approved engineering change window.
references:
  - https://attack.mitre.org/techniques/T0843/
tags:
  - attack.ics.t0843
  - attack.t1105
author: Mahesh
date: 2026/07/01
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith:
      - '.exe'
      - '.dll'
      - '.ps1'
      - '.acd'
      - '.s7p'
      - '.ap16'
      - '.l5x'
    ComputerName|in_list: 'l3_scada_servers'
  timefilter:
    hour|gte: 20
  timefilter2:
    hour|lte: 5
  condition: selection and (timefilter or timefilter2)
falsepositives:
  - Authorized engineering file deployment during an approved off-hours change window
level: high
