title: Web or Email Content Landing on OT DMZ Jump Host
id: d1a1b2c3-0001-4a1b-8c1d-1a2b3c4d5e06
status: experimental
description: Detects browser or email-client process execution, or a file with a web-download/email-attachment zone-identifier marker, on a DMZ jump host. Jump hosts should be hardened bastion systems with no internet browsing or email capability; any such activity is high-confidence compromise or severe policy violation.
references:
  - https://attack.mitre.org/techniques/T1566/
tags:
  - attack.t1566
  - attack.ics.t0817
author: Mahesh
date: 2026/07/01
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ComputerName|in_list: 'dmz_jump_hosts'
    Image|endswith:
      - '\outlook.exe'
      - '\chrome.exe'
      - '\msedge.exe'
      - '\firefox.exe'
  condition: selection
falsepositives:
  - None expected on a properly hardened jump host
level: critical
