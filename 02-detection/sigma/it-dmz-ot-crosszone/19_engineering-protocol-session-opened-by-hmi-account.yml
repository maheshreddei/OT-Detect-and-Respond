title: Engineering Protocol Session Opened by HMI Account
id: d1a1b2c3-0004-4a1b-8c1d-4a2b3c4d5e03
status: experimental
description: Detects an HMI host or HMI service account opening an engineering-class protocol session (S7comm Job/Userdata, EtherNet/IP CIP unconnected message, OMRON FINS) rather than its normal supervisory polling traffic, which can indicate the HMI has been used as a pivot point to reach engineering-level PLC functions.
references:
  - https://attack.mitre.org/techniques/T0867/
tags:
  - attack.ics.t0867
  - attack.ics.t0858
author: Mahesh
date: 2026/07/01
logsource:
  category: ics-network
  product: generic
detection:
  selection:
    src_ip|in_list: 'l2_hmi_hosts'
    proto:
      - s7comm
      - cip
      - fins
    rosctr:
      - 'Job'
      - 'Userdata'
  condition: selection
falsepositives:
  - HMI legitimately configured to perform diagnostic reads via engineering protocol services
level: high
