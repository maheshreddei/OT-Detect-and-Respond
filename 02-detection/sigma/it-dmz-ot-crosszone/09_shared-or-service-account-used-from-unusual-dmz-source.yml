title: Shared or Service Account Used From Unusual DMZ Source
id: d1a1b2c3-0002-4a1b-8c1d-2a2b3c4d5e03
status: experimental
description: Detects an engineering or vendor shared/service account authenticating from a DMZ host other than its single documented jump path, indicating credential reuse, theft, or an attacker pivoting using harvested service-account credentials.
references:
  - https://attack.mitre.org/techniques/T1078/
tags:
  - attack.t1078
  - attack.ics.t0859
author: Mahesh
date: 2026/07/01
logsource:
  category: authentication
  product: windows
detection:
  selection:
    EventID: 4624
    TargetUserName|in_list: 'shared_service_accounts'
  filter:
    WorkstationName|in_list: 'documented_jump_path_for_account'
  condition: selection and not filter
falsepositives:
  - Documented jump-path mapping not yet updated after an approved architecture change
level: high
