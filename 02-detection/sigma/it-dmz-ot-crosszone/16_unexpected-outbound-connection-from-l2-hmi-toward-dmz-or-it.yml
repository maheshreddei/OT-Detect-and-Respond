title: Unexpected Outbound Connection from L2 HMI Toward DMZ or IT
id: d1a1b2c3-0003-4a1b-8c1d-3a2b3c4d5e05
status: experimental
description: Detects an L2 HMI host initiating an outbound connection toward the OT DMZ or IT zone. HMIs are typically pure consumers of supervisory data and should not act as connection initiators toward higher zones; this pattern is consistent with C2 beaconing or data staging.
references:
  - https://attack.mitre.org/techniques/T0886/
tags:
  - attack.ics.t0886
  - attack.t1041
author: Mahesh
date: 2026/07/01
logsource:
  category: firewall
  product: generic
detection:
  selection:
    src_zone: L2_HMI
    dst_zone:
      - OT_DMZ
      - IT
  filter:
    dst_ip|in_list: 'approved_l2_outbound_destinations'
  condition: selection and not filter
falsepositives:
  - Approved historian/alarm-forwarding flow not yet documented in the allow-list
level: high
