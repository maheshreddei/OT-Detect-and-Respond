title: Remote Access Session into L3 Without Approved Change Window
id: d1a1b2c3-0002-4a1b-8c1d-2a2b3c4d5e02
status: experimental
description: Detects a VPN or jump-server interactive logon to an L3 SCADA/site-operations server occurring outside the standard business hours / approved maintenance window, which should be correlated against the change-management ticketing system before closure.
references:
  - https://attack.mitre.org/techniques/T1133/
tags:
  - attack.t1133
  - attack.ics.t0859
author: Mahesh
date: 2026/07/01
logsource:
  category: authentication
  product: windows
detection:
  selection:
    EventID: 4624
    LogonType:
      - 10
      - 3
    TargetComputerName|in_list: 'l3_scada_servers'
  timefilter:
    hour|gte: 20
  timefilter2:
    hour|lte: 5
  condition: selection and (timefilter or timefilter2)
falsepositives:
  - Approved emergency maintenance session with an associated change ticket
level: medium
