title: Engineering Software Launched by Non-Engineering Account
id: d1a1b2c3-0003-4a1b-8c1d-3a2b3c4d5e03
status: experimental
description: Detects PLC/HMI engineering software (Studio 5000, TIA Portal, RSLogix, WinCC Engineering) being launched by a user account that is not a member of the designated engineering role group, indicating a privilege/role mismatch that may signal credential compromise.
references:
  - https://attack.mitre.org/techniques/T0858/
tags:
  - attack.ics.t0858
  - attack.t1078
author: Mahesh
date: 2026/07/01
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\Studio5000.exe'
      - '\TIA Portal.exe'
      - '\RSLogix5000.exe'
      - '\WinCCExplorer.exe'
  filter:
    User|in_list: 'engineering_role_group'
  condition: selection and not filter
falsepositives:
  - Read-only access by a supervisor or auditor account that is intentionally excluded from the engineering group
level: high
