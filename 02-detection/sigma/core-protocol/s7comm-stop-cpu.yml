title: S7comm STOP CPU Command to PLC
id: 6fa040fd-076c-4b52-80ee-a195bbdcdfdf
status: stable
description: |
  Detects an S7comm PLC-control job requesting CPU STOP (function P_PROGRAM / PLC
  Stop). Halting a Siemens S7 CPU stops process execution and is a direct
  Inhibit Response Function / availability-impact action. Should only ever originate
  from an authorized engineering workstation during a controlled change.
references:
  - https://attack.mitre.org/techniques/T0816/
author: Mahesh Reddy
date: 2026/08/09
tags:
  - attack.ics
  - attack.inhibit-response-function
  - attack.t0816
logsource:
  product: zeek
  service: s7comm
detection:
  plc_control:
    rosctr: 'USERDATA'
    function|contains:
      - 'PLC_STOP'
      - 'P_PROGRAM'
  authorized:
    id.orig_h:
      - '10.20.30.11'   # EWS-01 (replace with authorized EWS list)
  condition: plc_control and not authorized
fields:
  - id.orig_h
  - id.resp_h
  - rosctr
  - function
falsepositives:
  - Authorized engineering change with an unlisted EWS
level: high
uc_id: OT-UC-0005
nozomi_type_id: PROT:S7-ILLEGAL
sectors: [Manufacturing, Oil & Gas]
threat_actors: [CHERNOVITE, ELECTRUM]
