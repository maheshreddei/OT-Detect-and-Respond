title: PLC Configuration Drift From Verified Offline Backup
id: sw10a1b2-c3d4-4e5f-9081-000000000001
status: experimental
description: Detects a live PLC's program checksum or block hash differing from the last verified offline reference backup without a corresponding approved change record, operationalizing the advisory's threat-hunting hypothesis (H5) that critical process unit logic may be silently modified since the last verified configuration baseline.
references:
  - Shieldworkz OT Cyber Threat Intelligence Advisory, Middle East (June 2026)
threat_actor: Generalized (integrity-verification hunt, not actor-specific)
tags:
  - attack.ics.t0873
  - attack.ics.t0839
author: Mahesh
date: 2026/07/01
logsource:
  category: ics-network
  product: generic
detection:
  selection:
    event_type: 'plc_checksum_mismatch'
  filter:
    change_ticket_active: true
  condition: selection and not filter
falsepositives:
  - Approved logic change not yet reconciled against the offline backup reference set
level: critical
