title: Remote Management Tool Installation on OT-Adjacent Host (MuddyWater Pattern)
id: sw02a1b2-c3d4-4e5f-9081-000000000001
status: experimental
description: Detects installation or first-run execution of Atera, RemoteUtilities, or ScreenConnect on a host within the OT DMZ or L3 server tier outside the approved software baseline, the remote-management tooling MuddyWater is documented using to gain footholds that are then handed off to other IRGC-directed actors for further OT-relevant exploitation.
references:
  - Shieldworkz OT Cyber Threat Intelligence Advisory, Middle East (June 2026)
  - CISA/FBI/CNMF MuddyWater Advisory (2022)
threat_actor: MuddyWater (Static Kitten / MERCURY)
tags:
  - attack.t1219
  - attack.ics.t0883
author: Mahesh
date: 2026/07/01
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\AteraAgent.exe'
      - '\RemoteUtilities.exe'
      - '\ScreenConnect.ClientService.exe'
    ComputerName|in_list:
      - 'dmz_jump_hosts'
      - 'l3_scada_servers'
  filter:
    approved_software_baseline: true
  condition: selection and not filter
falsepositives:
  - Legitimately approved remote-support tool added to the baseline without updating this rule's exclusion list
level: high
