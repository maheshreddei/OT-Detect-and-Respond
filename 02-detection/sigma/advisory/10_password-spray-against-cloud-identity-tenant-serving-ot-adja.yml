title: Password Spray Against Cloud Identity Tenant Serving OT-Adjacent Accounts
id: sw08a1b2-c3d4-4e5f-9081-000000000001
status: experimental
description: Detects password-spray authentication patterns against an Office 365 / Azure AD tenant where the targeted accounts include OT engineering or energy-sector operations staff, the specific cloud-identity attack vector the advisory attributes to sustained APT33 activity against Saudi and UAE energy organizations in 2025-2026 (distinct from on-premises VPN spray, which is covered separately).
references:
  - Shieldworkz OT Cyber Threat Intelligence Advisory, Middle East (June 2026)
threat_actor: APT33 / Elfin (Refined Kitten)
tags:
  - attack.t1110.003
  - attack.t1078.004
author: Mahesh
date: 2026/07/01
logsource:
  category: authentication
  product: azuread
detection:
  selection:
    ResultType:
      - '50126'
      - '50053'
    UserPrincipalName|in_list: 'ot_engineering_staff_upns'
  timeframe: 30m
  condition: selection | count(distinct UserPrincipalName) by src_ip > 10
falsepositives:
  - Legacy application using outdated stored credentials against multiple service accounts
level: high
