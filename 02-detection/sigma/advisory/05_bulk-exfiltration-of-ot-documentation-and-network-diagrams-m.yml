title: Bulk Exfiltration of OT Documentation and Network Diagrams (Moses Staff Pattern)
id: sw03a1b2-c3d4-4e5f-9081-000000000001
status: experimental
description: Detects a large-volume outbound data transfer or archive-creation event (zip/rar/7z) on a host holding OT engineering documentation, network diagrams, or process specifications, matching the data-theft-for-publication pattern used by Moses Staff/Abraham's Ax against Israeli and Gulf-aligned industrial targets to support future targeted attack planning.
references:
  - Shieldworkz OT Cyber Threat Intelligence Advisory, Middle East (June 2026)
threat_actor: Moses Staff / Abraham's Ax
tags:
  - attack.t1560
  - attack.t1567
  - attack.ics.t0811
author: Mahesh
date: 2026/07/01
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\7z.exe'
      - '\rar.exe'
      - '\WinRAR.exe'
    CommandLine|contains:
      - 'network diagram'
      - 'P&ID'
      - 'engineering'
    ComputerName|in_list: 'l3_scada_servers'
  condition: selection
falsepositives:
  - Authorized engineering team archiving documentation for an approved external audit or vendor handoff
level: high
