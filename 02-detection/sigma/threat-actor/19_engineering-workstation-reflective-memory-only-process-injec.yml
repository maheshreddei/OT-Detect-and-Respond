title: Engineering Workstation Reflective/Memory-Only Process Injection
id: ta06a1b2-c3d4-4e5f-8071-006000000001
status: experimental
description: Detects indicators of reflective DLL loading or memory-only code execution (no corresponding on-disk image, anomalous memory protection flags) on an engineering workstation, the evasion class of technique pioneered by Stuxnet's rootkit components to hide malicious PLC project-file modifications from the engineering software's normal view.
references:
  - MITRE ATT&CK Software S0603 (Stuxnet)
threat_actor: Generalized (Stuxnet-class TTP)
tags:
  - attack.t1055
  - attack.ics.t0851
author: Mahesh
date: 2026/07/01
logsource:
  category: process_access
  product: windows
detection:
  selection:
    ComputerName|in_list: 'designated_engineering_workstations'
    CallTrace|contains: 'UNKNOWN'
  condition: selection
falsepositives:
  - Legitimate licensing/anti-tamper module used by some engineering software suites
level: high
