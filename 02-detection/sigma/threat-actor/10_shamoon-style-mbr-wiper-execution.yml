title: Shamoon-Style MBR Wiper Execution
id: ta03a1b2-c3d4-4e5f-8071-003000000001
status: experimental
description: Detects direct raw access to the physical disk device (\\.\PhysicalDrive0) combined with a service-creation event immediately followed by a system reboot, matching the Shamoon V3 wiper behavior attributed to APT33 in destructive attacks against Saudi Arabian and UAE energy-sector organizations.
references:
  - SOC Prime APT33 Shamoon and Filerase Wipers
  - MITRE ATT&CK Software S0140 (Shamoon)
threat_actor: APT33 / Elfin (Refined Kitten)
tags:
  - attack.t1561.002
  - attack.t1529
  - attack.ics.t0826
author: Mahesh
date: 2026/07/01
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains: '\\.\PhysicalDrive'
  condition: selection
falsepositives:
  - Authorized low-level disk imaging/forensics tool used by IT operations
level: critical
