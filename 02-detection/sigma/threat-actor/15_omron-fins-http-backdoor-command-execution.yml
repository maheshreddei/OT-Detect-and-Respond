title: OMRON FINS/HTTP Backdoor Command Execution
id: ta04a1b2-c3d4-4e5f-8071-004000000003
status: experimental
description: Detects FINS protocol commands or HTTP requests to an OMRON controller's diagnostic/backdoor interface from a source not in the engineering allow-list, matching the CHERNOVITE/PIPEDREAM OMSHELL module's technique for scanning, connecting to, and issuing arbitrary commands against OMRON Sysmac NEX controllers.
references:
  - CISA AA22-103A PIPEDREAM/INCONTROLLER Advisory
threat_actor: CHERNOVITE (PIPEDREAM / INCONTROLLER)
tags:
  - attack.ics.t0859
  - attack.ics.t0883
author: Mahesh
date: 2026/07/01
logsource:
  category: ics-network
  product: fins
detection:
  selection:
    proto: fins
  filter:
    src_ip|in_list: 'designated_engineering_workstations'
  condition: selection and not filter
falsepositives:
  - Newly deployed HMI/SCADA polling node not yet added to the allow-list
level: high
