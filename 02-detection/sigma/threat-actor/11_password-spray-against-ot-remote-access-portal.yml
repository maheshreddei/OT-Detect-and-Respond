title: Password Spray Against OT Remote Access Portal
id: ta03a1b2-c3d4-4e5f-8071-003000000002
status: experimental
description: Detects a single source IP attempting authentication against many distinct user accounts on the OT remote-access VPN or jump-server portal within a short window, the initial-access technique APT33 has consistently used (alongside supply-chain compromise) against aerospace, energy, and government targets.
references:
  - Nozomi Networks Iranian APT Activity Middle East 2026
threat_actor: APT33 / Elfin
tags:
  - attack.t1110.003
  - attack.t1133
author: Mahesh
date: 2026/07/01
logsource:
  category: authentication
  product: vpn
detection:
  selection:
    auth_result: failure
  timeframe: 10m
  condition: selection | count(distinct username) by src_ip > 15
falsepositives:
  - Misconfigured application performing repeated automated login attempts with stale credentials
level: high
