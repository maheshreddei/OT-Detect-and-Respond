title: Credential Harvesting Tool Execution on Engineering or SCADA Host
id: ta02a1b2-c3d4-4e5f-8071-002000000003
status: experimental
description: Detects execution of Mimikatz, LaZagne, or equivalent credential-dumping tool signatures (LSASS access, SAM/SECURITY hive read) on an engineering workstation or SCADA server, a technique APT34/OilRig has consistently used to expand access from an initial IT foothold toward OT-adjacent systems.
references:
  - Trellix Iranian Cyber Capability 2026
threat_actor: APT34 / OilRig
tags:
  - attack.t1003.001
  - attack.t1003.002
  - attack.ics.t0859
author: Mahesh
date: 2026/07/01
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|contains:
      - 'mimikatz'
      - 'lazagne'
  selection_lsass:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess: '0x1010'
  ComputerName|in_list: 'l2_l3_ot_servers'
  condition: (selection or selection_lsass)
falsepositives:
  - Authorized red-team or penetration-testing engagement against the OT environment
level: critical
