title: Modbus Diagnostic Restart Communications Function Code
id: 7a1e9b3a-1d2c-4e1a-9b4e-1a2b3c4d5e02
status: experimental
description: Detects Modbus Diagnostics (function code 08) sub-function 01 (Restart Communications Option), which forces a slave device to reinitialize its communication port — can be used as a denial-of-service technique against a PLC/RTU.
references:
  - https://www.modbus.org/docs/Modbus_Application_Protocol_V1_1b3.pdf
tags:
  - attack.ics.t0816
  - attack.ics.t0814
author: Mahesh
date: 2026/07/01
logsource:
  category: ics-network
  product: modbus
detection:
  selection:
    proto: modbus
    function_code: 8
    sub_function_code: 1
  condition: selection
falsepositives:
  - Scheduled maintenance window restart performed by engineering team
level: high
