title: Modbus Write Operation from Unauthorized Source
id: 7a1e9b3a-1d2c-4e1a-9b4e-1a2b3c4d5e01
status: experimental
description: Detects Modbus write function codes (05,06,0F,10) issued by a source IP that is not in the known engineering workstation/SCADA master allow-list.
references:
  - https://www.modbus.org/docs/Modbus_Application_Protocol_V1_1b3.pdf
tags:
  - attack.ics.t0855
  - attack.ics.t0836
author: Mahesh
date: 2026/07/01
logsource:
  category: ics-network
  product: modbus
detection:
  selection:
    proto: modbus
    function_code:
      - 5
      - 6
      - 15
      - 16
  filter:
    src_ip|cidr: '10.10.10.0/24'   # replace with engineering workstation/HMI subnet
  condition: selection and not filter
falsepositives:
  - Newly commissioned engineering workstation not yet added to allow-list
level: high
