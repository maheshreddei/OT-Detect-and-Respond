title: S-01 LSASS Process Access (Credential Dumping)
id: 707eb90e-4877-4bfb-b013-8cb4ca547136
status: experimental
description: >
  Suspicious handle to lsass.exe on S-01 with access masks consistent with
  credential extraction. Loss of SCADA-host credentials enables movement to the
  wider control network.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: Mahesh (ot-detection-program)
date: 2026/08/12
logsource:
  product: windows
  category: process_access     # Sysmon EventID 10
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1438'
      - '0x143a'
      - '0x1fffff'
  filter_known:
    SourceImage|endswith:
      - '\MsMpEng.exe'          # PLACEHOLDER: extend with sanctioned AV/EDR/backup images
      - '\wmiprvse.exe'
  condition: selection and not filter_known
fields:
  - SourceImage
  - GrantedAccess
  - CallTrace
falsepositives:
  - Endpoint protection / backup agents (baseline and exclude by image path)
level: high
tags:
  - attack.credential_access
  - attack.t1003.001
  - asset.s_01
