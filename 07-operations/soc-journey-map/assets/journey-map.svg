<rect x="150" y="202" width="380" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
<text x="340" y="226" text-anchor="middle" fill="#042C53" font-size="14" font-weight="500">3 · Deploy</text>
<text x="340" y="244" text-anchor="middle" fill="#185FA5" font-size="12">passive sensors · SIEM · tiered log onboarding</text>
<line x1="340" y1="258" x2="340" y2="286" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

