<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900"><defs><style>.t{font:700 28px Arial;fill:#172033}.h{font:700 17px Arial;fill:#172033}.s{font:14px Arial;fill:#334155}.b{stroke-width:3;rx:14}.a{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#m)}.r{stroke:#ea580c;stroke-width:3;fill:none;marker-end:url(#o)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#ea580c"/></marker></defs><rect width="1700" height="900" fill="white"/><text x="55" y="55" class="t">Ammonia and Urea Complex — Process and Control Context</text><text x="55" y="105" class="h">AMMONIA TRAIN</text><g fill="#dbeafe" stroke="#2563eb"><rect x="55" y="145" width="190" height="75" class="b"/><rect x="285" y="145" width="190" height="75" class="b"/><rect x="515" y="145" width="190" height="75" class="b"/><rect x="745" y="145" width="190" height="75" class="b"/><rect x="975" y="145" width="190" height="75" class="b"/><rect x="1205" y="145" width="190" height="75" class="b"/><rect x="1435" y="145" width="190" height="75" class="b"/></g><text x="93" y="180" class="h">Natural Gas</text><text x="87" y="204" class="s">Desulfurization</text><text x="324" y="180" class="h">Reforming</text><text x="305" y="204" class="s">Primary + secondary</text><text x="562" y="180" class="h">Shift</text><text x="539" y="204" class="s">CO → CO₂ + H₂</text><text x="784" y="180" class="h">CO₂ Removal</text><text x="1010" y="180" class="h">Methanation</text><text x="1245" y="180" class="h">Compression</text><text x="1463" y="180" class="h">Synthesis Loop</text><text x="1473" y="204" class="s">NH₃ + recycle</text><path d="M245 182H285M475 182H515M705 182H745M935 182H975M1165 182H1205M1395 182H1435" class="a"/><text x="55" y="305" class="h">UREA TRAIN</text><g fill="#dcfce7" stroke="#16a34a"><rect x="290" y="345" width="220" height="75" class="b"/><rect x="570" y="345" width="220" height="75" class="b"/><rect x="850" y="345" width="220" height="75" class="b"/><rect x="1130" y="345" width="220" height="75" class="b"/><rect x="1410" y="345" width="220" height="75" class="b"/></g><text x="326" y="378" class="h">NH₃ + CO₂ Synthesis</text><text x="336" y="403" class="s">Carbamate → urea</text><text x="615" y="378" class="h">Strip / Recover</text><text x="610" y="403" class="s">Recycle NH₃ and CO₂</text><text x="900" y="378" class="h">Concentrate</text><text x="893" y="403" class="s">Vacuum evaporation</text><text x="1173" y="378" class="h">Granulate / Prill</text><text x="1456" y="378" class="h">Finish / Store</text><text x="1440" y="403" class="s">Cool, screen, bag/load</text><path d="M510 382H570M790 382H850M1070 382H1130M1350 382H1410" class="a"/><path d="M840 220V285H400V345" class="r"/><text x="592" y="275" class="s">Recovered CO₂ to urea</text><path d="M1530 220V285H450V345" class="r"/><text x="1185" y="275" class="s">Ammonia feed</text><text x="55" y="520" class="h">CONTROL AND PROTECTION LAYERS</text><g><rect x="55" y="560" width="290" height="125" fill="#e0e7ff" stroke="#4f46e5" class="b"/><text x="140" y="597" class="h">DCS</text><text x="86" y="626" class="s">Continuous process control</text><text x="80" y="650" class="s">Loops, sequences, alarms, HMI</text><rect x="385" y="560" width="290" height="125" fill="#fef3c7" stroke="#d97706" class="b"/><text x="475" y="597" class="h">PLC / Package</text><text x="415" y="626" class="s">Compressors, granulation, utilities</text><text x="430" y="650" class="s">Local logic and interlocks</text><rect x="715" y="560" width="290" height="125" fill="#fee2e2" stroke="#dc2626" class="b"/><text x="810" y="597" class="h">SIS / ESD</text><text x="748" y="626" class="s">Independent safety functions</text><text x="760" y="650" class="s">Trips and final elements</text><rect x="1045" y="560" width="290" height="125" fi