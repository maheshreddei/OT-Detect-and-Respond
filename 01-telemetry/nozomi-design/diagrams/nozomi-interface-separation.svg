<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850"><defs><style>.t{font:700 28px Arial;fill:#172033}.h{font:700 19px Arial;fill:#172033}.s{font:15px Arial;fill:#334155}.p{stroke:#0f766e;stroke-width:5;fill:none;marker-end:url(#g)}.m{stroke:#2563eb;stroke-width:4;fill:none;stroke-dasharray:9 7;marker-end:url(#b)}.x{stroke:#dc2626;stroke-width:5}.box{stroke-width:3;rx:15}</style><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#0f766e"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2563eb"/></marker></defs><rect width="1600" height="850" fill="white"/><text x="55" y="55" class="t">Nozomi Guardian — Management and Monitoring Interface Separation</text><rect x="65" y="120" width="350" height="130" fill="#ffedd5" stroke="#ea580c" class="box"/><text x="135" y="165" class="h">OT Production Network</text><text x="110" y="195" class="s">PLC • HMI • EWS • Historian</text><text x="125" y="222" class="s">Control traffic remains in path</text><rect x="65" y="360" width="350" height="105" fill="#f1f5f9" stroke="#475569" class="box"/><text x="125" y="402" class="h">SPAN / TAP / Broker</text><text x="108" y="435" class="s">Creates an out-of-band packet copy</text><path d="M240 250V360" class="p"/><rect x="565" y="175" width="480" height="385" fill="#f8fafc" stroke="#64748b" class="box"/><text x="710" y="215" class="h">Nozomi Guardian</text><rect x="625" y="265" width="350" height="90" fill="#dbeafe" stroke="#2563eb" class="box"/><text x="710" y="303" class="h">Management Port</text><text x="660" y="331" class="s">Static IP • gateway • HTTPS/API • NTP</text><rect x="625" y="415" width="350" height="90" fill="#ccfbf1" stroke="#0f766e" class="box"/><text x="710" y="453" class="h">Monitoring Port(s)</text><text x="655" y="481" class="s">Passive ingest • normally no production IP</text><path d="M415 412H625" class="p"/><text x="430" y="395" class="s">Copied packets only</text><rect x="1190" y="120" width="340" height="130" fill="#dbeafe" stroke="#2563eb" class="box"/><text x="1260" y="165" class="h">Security Management</text><text x="1230" y="195" class="s">Jump host • CMC • SIEM • PKI</text><text x="1235" y="222" class="s">Restricted VLAN / VRF / firewall</text><path d="M1190 185H1045V310H975" class="m"/><rect x="1190" y="360" width="340" height="105" fill="#ede9fe" stroke="#7c3aed" class="box"/><text x="1250" y="402" class="h">Expansion Interfaces</text><text x="1225" y="432" class="s">Model-specific monitoring capacity</text><path d="M1190 412H1045V460H975" class="p"/><rect x="460" y="655" width="680" height="105" fill="#fee2e2" stroke="#dc2626" class="box"/><text x="590" y="695" class="h">Never connect or configure the planes interchangeably</text><text x="535" y="729" class="s">SPAN/TAP output → monitoring port. Routed administration/integrations → management port.</text><path d="M485 600L535 650M535 600L485 650" class="x"/><text x="55" y="815" class="s">Exact physical labels, port counts, optics and expansion roles vary by Guardian appliance model and N2OS release.</text></svg>