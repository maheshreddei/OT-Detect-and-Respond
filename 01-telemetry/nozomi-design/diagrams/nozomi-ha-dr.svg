<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.t{font:700 28px Arial;fill:#172033}.h{font:700 19px Arial;fill:#172033}.s{font:15px Arial;fill:#334155}.box{stroke-width:3;rx:14}.a{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#m)}.r{stroke:#dc2626;stroke-width:3;fill:none;stroke-dasharray:9 7;marker-end:url(#mr)}.sync{stroke:#7c3aed;stroke-width:5;fill:none;marker-end:url(#mp)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker><marker id="mr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#dc2626"/></marker><marker id="mp" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#7c3aed"/></marker></defs><rect width="1600" height="900" fill="white"/><text x="55" y="55" class="t">Nozomi Availability and Disaster-Recovery Architecture</text><rect x="55" y="90" width="700" height="250" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" rx="18"/><text x="80" y="125" class="h">Primary Failure Domain — Data Center A</text><rect x="115" y="165" width="250" height="70" fill="#ddd6fe" stroke="#7c3aed" class="box"/><text x="190" y="207" class="h">CMC-A</text><rect x="445" y="165" width="250" height="70" fill="#ccfbf1" stroke="#0f766e" class="box"/><text x="503" y="207" class="h">Guardian-A</text><rect x="845" y="90" width="700" height="250" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" rx="18"/><text x="870" y="125" class="h">Secondary Failure Domain — Data Center B</text><rect x="905" y="165" width="250" height="70" fill="#ddd6fe" stroke="#7c3aed" class="box"/><text x="980" y="207" class="h">CMC-B</text><rect x="1235" y="165" width="250" height="70" fill="#ccfbf1" stroke="#0f766e" class="box"/><text x="1293" y="207" class="h">Guardian-B</text><path d="M365 200 H905" class="sync"/><path d="M905 220 H365" class="sync"/><text x="585" y="187" class="s">Supported CMC replication</text><rect x="105" y="400" width="330" height="75" fill="#dbeafe" stroke="#2563eb" class="box"/><text x="155" y="432" class="h">Independent Capture A</text><text x="148" y="458" class="s">TAP / broker output / path A</text><rect x="1165" y="400" width="330" height="75" fill="#dbeafe" stroke="#2563eb" class="box"/><text x="1215" y="432" class="h">Independent Capture B</text><text x="1208" y="458" class="s">TAP / broker output / path B</text><path d="M270 400 V300 H570 V235" class="a"/><path d="M1330 400 V300 H1360 V235" class="a"/><rect x="550" y="390" width="500" height="105" fill="#fee2e2" stroke="#dc2626" class="box"/><text x="635" y="428" class="h">Do not assume Guardian stateful HA</text><text x="588" y="458" class="s">Use independent visibility domains or validated duplicate feeds.</text><text x="620" y="482" class="s">Check duplicate data and license consequences.</text><rect x="105" y="585" width="390" height="145" fill="#fef3c7" stroke="#d97706" class="box"/><text x="160" y="625" class="h">Encrypted Backup Repository</text><text x="145" y="658" class="s">Daily / weekly / monthly generations</text><text x="145" y="684" class="s">Separate failure domain, vaulted password</text><text x="145" y="710" class="s">Hash, inventory and restore-test</text><rect x="605" y="585" width="390" height="145" fill="#f1f5f9" stroke="#475569" class="box"/><text x="680" y="625" class="h">Replacement Capacity</text><text x="650" y="658" class="s">Validated model and compatible N2OS</text><text x="650" y="684" class="s">License/RMA, optics, cables, build sheet</text><text x="650" y="710" class="s">Tested restore and recabling runbook</text><rect x="1105" y="585" width="390" height="145" fill="#dcfce7" stroke="#16a34a" class="box"/><text x="1195" y="625" class="h">DR Acceptance</text><text x="1150" y="658" class="s">Failover, rebuild and re-synchronization</text><text x="1150" y="684" class="s">Packet visibility and SIEM test event</text><text x="1150" y="710" class="s">Measured RTO/RPO and evidence</text><path d="M300 585 V510 H240" class="r"/><path d="M495 657 H605" class="a"/><path d="M995 657 H1105" class="a"/><text x="55" y="840" class="s">Availability must cover acquisition, analysis, central management, integrations and evidence—not only appliance power.</text></svg>